name: workflow
on:
    push:
        branches:
            - main
        paths-ignore:
            - 'README.md'

jobs:
    integration:
        name: Continuous Integration
        runs-on: macos-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v3

            - name: Install Dependencies (macOS)
              run: |
                brew update
                brew install jq awscli
                if ! command -v docker &> /dev/null; then
                    brew install docker
                    brew install --cask docker
                fi

            - name: Lint Code
              run: echo "Linting repository"
            
            - name: Run unit tests
              run: echo "Running unit tests"
    
    build-and-push-ecr-image: 
        name: Continuous Delivery
        needs: integration
        runs-on: macos-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v3
            
            - name: Install Dependencies (macOS)
              run: |
                brew update
                brew install jq awscli
                if ! command -v docker &> /dev/null; then
                    brew install docker
                    brew install --cask docker
                fi

            - name: Start Docker Daemon (if needed)
              run: |
                open -a Docker || echo "Docker is already running"
                sleep 15  # Wait for Docker to start

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v1
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ secrets.AWS_REGION }}

            - name: Login to AWS ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v1

            - name: Build, Tag, and Push Image to Amazon ECR
              env: 
                ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
                ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                IMAGE_TAG: ${{ github.sha }}
              run: |
                docker buildx create --use  # Enable BuildKit on macOS
                docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
                docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
                echo "IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

    continuous-deployment: 
        needs: build-and-push-ecr-image
        runs-on: self-hosted
        steps:
            - name: Checkout Code
              uses: actions/checkout@v3
            
            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v1
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ secrets.AWS_REGION }}

            - name: Login to AWS ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v1

            - name: Pull Latest Image
              run: |
                docker pull ${{ secrets.AWS_ECR_LOGIN_URI }}/${{ secrets.ECR_REPOSITORY_NAME }}:${{ github.sha }}

            - name: Stop and Remove Previous Containers
              run: |
                docker ps -q | xargs -I {} docker rm -f {} || true

            - name: Run Docker Image
              run: |
                docker run -d -p 8080:8080 --ipc="host" --name=mltest \
                -e 'AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}' \
                -e 'AWS_REGION=${{ secrets.AWS_REGION }}' \
                ${{ secrets.AWS_ECR_LOGIN_URI }}/${{ secrets.ECR_REPOSITORY_NAME }}:${{ github.sha }}

            - name: Clean Docker Resources
              run: |
                docker system prune -f